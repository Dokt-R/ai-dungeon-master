[pytest]
addopts =
    --ignore=packages/backend/tests/test_transcript_logger.py
    ; --cov=packages           ; measure coverage for your "packages" folder
    ; --cov-report=term-missing
    ; --cov-report=html
    ; --cov-report=xml
    ; -n auto
    ; --dist=loadscope
testpaths = 
    # ./tests/
filterwarnings = 
    ignore:.*datetime.datetime.utcnow\(\) is deprecated.*
    ignore:.*Can't sort tables for DROP.*:sqlalchemy.exc.SAWarning
pythonpath = .