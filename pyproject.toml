[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_dm_project"
version = "0.1.0"
description = "AI Dungeon Master build with BMAD v4"
authors = [
    { name = "Nikolaos Papadopoulos", email = "nikolaospap94@gmail.com" }
]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 88
lint.extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["packages"]  # Your local modules
combine-as-imports = true